<!DOCTYPE html>
<html>
<head>
<title>LECTURE OF CSS flexbox</title>
<style>

header{
      background-color:red;
      text-align:center;
      font-size:30px;
      color:white;
      border-radius:15px;
      padding:20px;
      margin-bottom:20px;
      font-family:italic;
      }

h1{
   font-size:25px;
   } 

h2{
  font-size:30px;
  background-color:#7158EA;
  padding:15px;
  text-align:center; 
  }
 
.flex-container{
              display:flex;
              gap:25px;
              background-color:pink;
              padding:20px;
              border-radius:19px;
              margin-bottom:20px;
            }

.flex-coloumn{
             display:flex;
             flex-direction:coloumn;
             padding:20px;
             border-radius:20px;
             margin-bottom:20px;
             background-color:green;
             gap:20px;
             }              

.box{
   background-color:lime;
   color:red;
   border-radius:20px;
   font-size:20px;
   font-family:italic bold;
   text-align:center;
   padding:20px;
   }

.box-green{
 background-color:orange;
  }

.box-silver{
 background-color:silver;
     }

.box-lime{
  backdround-color:darklime;
     }

.box-red{
   background-color:pink;
    }


footer{
    background-color:brown;
    color:white;
    font-size:20px;
    padding:20px;
    text-align:center;
    }

</style>

</head>
<body>

<header>
<h1><b>ICS flex-box</b></h1>
<p>Learn how to arrange element</p>
</header>


<h2>CSS Flex-box side by side</h2>
<div class="flex-container">
 <div class="box">box 1</div>
 <div class="box box-lime">box 2</div>
 <div class="box box-green">box 3</div>
 <div class="box box-orange">box 4</div>
</div>

<h2>Flex box-coloum</h2>
<div class="flex box-coloum">
  <div class="box">box 1</div>
  <div class="box box-red">box 2</div>
  <div class="box box-green">box 3</div>
  <div class="box box-lime">box 4</div>
</div>


<br>

<footer>
<p>& all reserved of my website</p>
</footer>

</body>
</html>
