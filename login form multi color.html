<!DOCTYPE html>
<html>
<head>
<title>practice </title>
<style>

body{
 height:100vh;
 align-items: center;
 justify-content: center;
 background: linear-gradient(145deg, orange, #39549F, #437ABA, red, #50767E, #258273, purple);
 margin:0;
 display:flex;
 
  }

.login-box{
  width:50vh;
  background:white;
  text-align:left;
  height:65vh;
  padding:45px;
  transition: 0.3s;
  border-radius:20px;
  box-shadow: 20px 30px 50px rgba(0, 0, 0, 0.6);
  cursor:pointer;
  
  }

.login-box:hover{
  transform: translateY(-5px);
  box-shadow: 10px 20px 30px rgba(0, 0, 0, o.3);
  }

 h1{
  font-size:28px;
  color:red;
  text-align:center;
  text-decorate: underline;
  margin-bottom:10px;
    }

.login-box .subtitle{
   text-align:center;
   font-size:15px;
   color:black;
  margin-bottom:20px;
   }

.login-box label{
  display:block;
  text-align:0;
  font-size:18px;
  color:darkblue;
  font-family:bold;
  }

 .login-box input {
            width: 90%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: 0.3s;
            background: white;
        }

        .login-box input:focus {
            border-color: #42a5f5;
            background: lightyellow;
            outline: none;
            box-shadow: 0 0 10px rgba(66, 165, 245, 0.3);
        }

        .login-box input::placeholder {
            color: #aaa;
            font-size: 14px;
        }

.login-box .btn{
  padding:15px 22vh;
  background: linear-gradient(90deg, #258273, #164E98, #0E4389, #437ABA );
  font-size:20px;
  border-radius:10px;
  text-align:center;
  margin-bottom:30px;
  transition:0.4s;
  color:white;
  cursor:pointer;
  }

.login-box button:hover{
  transform: scale(1.o2);
  background: linear-gradient(90deg, red, #437ABA, #258273, #164E98, #0E4389, black);

  }

 .divider {
            text-align: center;
            margin: 10px 0;
            color: #aaa;
            font-size: 14px;
        }

.divider::before,
.divider::after{
 content="-";
 color:red;
}

.login-box .forgot {
            text-align: center;
            margin-top: 10px;
        }

        .login-box .forgot a {
            color: #42a5f5;
            text-decoration: underline;
            font-size: 15px;
            transition: 0.3s;
        }





</style>
</head>
<body>
<div class="login-box">
<h1>Welcome Back!</h1>
<p class="subtitle">Login to your Account</p>

<form>
<label>Name</label>
<input text="text"  placeholder="Enter your name">
<br>

<label>Email</label>
<input text="text"  placeholder="Enter your City name">
<br>


<label>Password</label>
<input text="text"  placeholder="Enter your password">
<br>

<button class="btn">Enter</button>

 <div class="divider">OR</div>

 <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

</div>
</body>
</html>
